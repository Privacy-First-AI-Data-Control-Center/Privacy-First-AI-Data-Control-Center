name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend API (NestJS Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build NestJS API
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

  local-agent-verify:
    name: Local Agent (Typecheck, Build & 37 Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck & Build Local Agent
        run: |
          npm run typecheck
          npm run build

      - name: Run Unit & Hook Pipeline Tests
        run: npm test
